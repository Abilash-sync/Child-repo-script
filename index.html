<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>to-do list apps</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f5f6fa;
      margin: 0;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }
    .app {
      background: #fff;
      width: 100%;
      max-width: 480px;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    }
    h1 { margin: 0 0 1rem; font-size: 1.5rem; }
    form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.6rem 0.8rem;
      border: 1px solid #d0d4dd;
      border-radius: 8px;
      font-size: 1rem;
    }
    button {
      padding: 0.6rem 0.9rem;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0.8rem;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      margin-bottom: 0.5rem;
      background: #fafafa;
    }
    li.done span { text-decoration: line-through; color: #9ca3af; }
    li span { cursor: pointer; flex: 1; }
    .delete {
      background: transparent;
      color: #ef4444;
      font-size: 0.9rem;
      padding: 0.2rem 0.5rem;
    }
    .delete:hover { background: transparent; text-decoration: underline; }
    .empty { text-align: center; color: #9ca3af; padding: 1rem 0; }
  </style>
</head>
<body>
  <div class="app">
    <h1>📝 To-Do List</h1>
    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="What needs doing?" autocomplete="off" required />
      <button type="submit">Add</button>
    </form>
    <ul id="todo-list"></ul>
    <p id="empty" class="empty">No tasks yet. Add one above!</p>
  </div>

  <script>
    const form = document.getElementById('todo-form');
    const input = document.getElementById('todo-input');
    const list = document.getElementById('todo-list');
    const empty = document.getElementById('empty');

    let todos = JSON.parse(localStorage.getItem('todos') || '[]');

    function render() {
      list.innerHTML = '';
      empty.style.display = todos.length === 0 ? 'block' : 'none';
      todos.forEach((todo, i) => {
        const li = document.createElement('li');
        if (todo.done) li.classList.add('done');
        const span = document.createElement('span');
        span.textContent = todo.text;
        span.addEventListener('click', () => {
          todos[i].done = !todos[i].done;
          save();
          render();
        });
        const del = document.createElement('button');
        del.textContent = 'Delete';
        del.className = 'delete';
        del.addEventListener('click', () => {
          todos.splice(i, 1);
          save();
          render();
        });
        li.appendChild(span);
        li.appendChild(del);
        list.appendChild(li);
      });
    }

    function save() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      todos.push({ text, done: false });
      input.value = '';
      save();
      render();
    });

    render();
  </script>
</body>
</html>
